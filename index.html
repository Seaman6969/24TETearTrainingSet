<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Software · Linux Download</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f6f8fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
            color: #24292f;
        }

        .container {
            max-width: 640px;
            width: 100%;
            background: #ffffff;
            border-radius: 12px;
            padding: 3rem 2.5rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 1rem;
            color: #57606a;
            margin-bottom: 2rem;
        }

        .version-badge {
            display: inline-block;
            background: #eaeef2;
            padding: 0.2rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #57606a;
            margin-bottom: 2rem;
        }

        .download-card {
            background: #f6f8fa;
            border: 1px solid #d0d7de;
            border-radius: 10px;
            padding: 2rem 1.5rem;
        }

        .download-card h2 {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .download-card .platform-detail {
            font-size: 0.85rem;
            color: #57606a;
            margin-bottom: 1.5rem;
        }

        .btn {
            display: inline-block;
            background: #2da44e;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            padding: 0.7rem 2.5rem;
            border-radius: 30px;
            text-decoration: none;
            border: 1px solid #2c974b;
            transition: background 0.15s;
        }

        .btn:hover {
            background: #2c974b;
        }

        .btn-secondary {
            background: #f6f8fa;
            color: #24292f;
            border: 1px solid #d0d7de;
            font-weight: 500;
            font-size: 0.85rem;
            padding: 0.4rem 1.2rem;
        }

        .btn-secondary:hover {
            background: #eaeef2;
        }

        .alt-formats {
            margin-top: 1rem;
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .checksum {
            margin-top: 1rem;
            font-size: 0.75rem;
            color: #57606a;
            background: #ffffff;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-family: monospace;
            word-break: break-all;
            border: 1px solid #eaeef2;
        }

        .source-section {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #eaeef2;
        }

        .source-section p {
            color: #57606a;
            font-size: 0.9rem;
            margin-bottom: 0.8rem;
        }

        .source-links {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: #8b949e;
        }

        .footer a {
            color: #0969da;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            .container {
                padding: 2rem 1.2rem;
            }
            h1 {
                font-size: 1.6rem;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <h1>My Software</h1>
        <p class="subtitle">Simple, fast, and open source</p>

        <div class="version-badge">Latest Release · v1.0.0</div>

        <div class="download-card">
            <h2>Linux</h2>
            <div class="platform-detail">x86_64 · AppImage (glibc 2.28+)</div>

            <a href="#" class="btn">Download AppImage</a>

            <div class="alt-formats">
                <a href="#" class="btn btn-secondary">deb</a>
                <a href="#" class="btn btn-secondary">rpm</a>
                <a href="#" class="btn btn-secondary">tar.gz</a>
            </div>

            <div class="checksum">
                SHA256: d3b07384d113edec49eaa6238ad5ff00
            </div>
        </div>

        <div class="source-section">
            <p>Source Code · MIT License</p>
            <div class="source-links">
                <a href="#" class="btn btn-secondary">Browse on GitHub</a>
                <a href="#" class="btn btn-secondary">Download ZIP</a>
            </div>
        </div>

        <div class="footer">
            <a href="#">GitHub Pages</a> · 
            <a href="#">Report Issue</a> · 
            <a href="#">Changelog</a>
        </div>

    </div>

</body>
</html>
