<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Software</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f6f8fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            background: white;
            padding: 3rem 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
            max-width: 450px;
            width: 100%;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .subtitle {
            color: #57606a;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 0.4rem;
            color: #24292f;
        }

        select {
            width: 100%;
            padding: 0.7rem 1rem;
            font-size: 1rem;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            background: white;
            color: #24292f;
            cursor: pointer;
        }

        select:focus {
            outline: none;
            border-color: #2da44e;
            box-shadow: 0 0 0 3px rgba(45, 164, 78, 0.15);
        }

        .btn {
            width: 100%;
            padding: 0.8rem;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            background: #2da44e;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn:hover {
            background: #2c974b;
        }

        .btn:disabled {
            background: #d0d7de;
            cursor: not-allowed;
        }

        .footer {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #8b949e;
            text-align: center;
        }

        .footer a {
            color: #0969da;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>My Software</h1>
        <p class="subtitle">Download the latest version</p>

        <form id="downloadForm">
            <div class="form-group">
                <label for="os">Operating System</label>
                <select id="os" required>
                    <option value="">Select OS...</option>
                    <option value="linux">Linux</option>
                    <option value="macos">macOS</option>
                    <option value="windows">Windows</option>
                </select>
            </div>

            <div class="form-group">
                <label for="version">Version</label>
                <select id="version" required>
                    <option value="">Select version...</option>
                    <option value="2.1.0">v2.1.0 (Latest)</option>
                    <option value="2.0.0">v2.0.0</option>
                    <option value="1.9.0">v1.9.0</option>
                </select>
            </div>

            <button type="submit" class="btn" id="downloadBtn" disabled>Download</button>
        </form>

        <div class="footer">
            <a href="#">Source Code</a> · 
            <a href="#">GitHub</a> · 
            <a href="#">Changelog</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('downloadForm');
        const osSelect = document.getElementById('os');
        const versionSelect = document.getElementById('version');
        const downloadBtn = document.getElementById('downloadBtn');

        function checkForm() {
            downloadBtn.disabled = !(osSelect.value && versionSelect.value);
        }

        osSelect.addEventListener('change', checkForm);
        versionSelect.addEventListener('change', checkForm);

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const os = osSelect.value;
            const version = versionSelect.value;
            
            // Replace this with your actual download URL
            const downloadUrl = `https://github.com/username/repo/releases/download/v${version}/software-${os}-v${version}.tar.gz`;
            
            window.location.href = downloadUrl;
        });
    </script>

</body>
</html>
